services:
  - type: web
    name: yele-backend
    runtime: go
    repo: https://github.com/yele-bf/mobiletest
    branch: main
    buildCommand: go build -o speedtest .
    startCommand: ./speedtest
    envVars:
      - key: SPEEDTEST_DATABASE_TYPE
        value: mongodb
      - key: SPEEDTEST_DATABASE_NAME
        value: yele_speedtest
      - key: SPEEDTEST_DATABASE_CONNECTION_STRING
        sync: false
    autoDeploy: false
    # Sonde de disponibilite : l'API de synthese du tableau de bord est la
    # route la plus representative (Atlas + agregations MongoDB). Un service
    # qui repond 200 ici sert reellement l'application.
    healthCheckPath: /api/dashboard/summary
    region: frankfurt
