services:
  - type: web
    name: yele-backend
    runtime: go
    repo: https://github.com/yele-bf/mobiletest
    branch: main
    buildCommand: go build -o speedtest .
    startCommand: ./speedtest
    envVars:
      - key: SPEEDTEST_DATABASE_TYPE
        value: mongodb
      - key: SPEEDTEST_DATABASE_NAME
        value: yele_speedtest
      - key: SPEEDTEST_DATABASE_CONNECTION_STRING
        sync: false
    autoDeploy: true
    region: frankfurt
